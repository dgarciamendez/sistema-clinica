# Configuración del servidor de Spring Boot
server.port=8080

# Conexión a la Base de Datos (Usa localhost por defecto, pero Docker lo sobrescribirá)
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/clinica_db
spring.datasource.username=clinica_user
spring.datasource.password=clinica_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
