version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: clinica-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-clinica_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clinica_pass}
      POSTGRES_DB: ${DB_NAME:-clinica_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - clinica-network

  backend:
    build:
      context: ./backend
    container_name: clinica-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-clinica_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-clinica_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-clinica_pass}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - clinica-network

  frontend:
    build:
      context: ./frontend
    container_name: clinica-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - clinica-network

volumes:
  postgres_data:

networks:
  clinica-network:
    driver: bridge